<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Verticlip</title>
<link rel="icon" href="/assets/verticlip-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<script>try{var t=localStorage.getItem("vc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-shell="app" data-page="settings">
<main>
  <header class="page-head"><div><h1>Settings</h1><p>Your profile and password.</p></div></header>
  <div class="stack" style="max-width:560px">
    <form class="card pad" id="profile">
      <h2 style="font-size:18px;margin-bottom:16px">Profile</h2>
      <div class="field"><label for="name">Name</label><input class="input" id="name" maxlength="80" autocomplete="name" /></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" disabled /></div>
      <button class="btn" style="margin-top:18px">Save profile</button>
    </form>
    <form class="card pad" id="pw">
      <h2 style="font-size:18px;margin-bottom:16px">Change password</h2>
      <div class="field"><label for="cur">Current password</label><input class="input" id="cur" type="password" autocomplete="current-password" required /></div>
      <div class="field"><label for="new">New password</label><input class="input" id="new" type="password" autocomplete="new-password" minlength="8" required /></div>
      <p class="muted" style="font-size:13px;margin-top:8px">Changing it signs you out everywhere else.</p>
      <button class="btn" style="margin-top:18px">Change password</button>
    </form>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
  const { $, api, toast } = VC;
  VC.loadMe().then((me) => { $("#name").value = me.user.name; $("#email").value = me.user.email; });
  $("#profile").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("/api/me", { method: "PATCH", body: { name: $("#name").value } }); toast("Saved"); VC.loadMe(true).then(VC.drawUsage); }
    catch (err) { toast(err.message, true); }
  };
  $("#pw").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("/api/me/password", { method: "POST", body: { current: $("#cur").value, new: $("#new").value } }); e.target.reset(); toast("Password changed"); }
    catch (err) { toast(err.message, true); }
  };
</script>
</body>
</html>
