<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your account · Verticlip</title>
<link rel="icon" href="/assets/verticlip-logo.svg" />
<link rel="preload" href="/static/fonts/SchibstedGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/static/fonts/fonts.css" />
<link rel="stylesheet" href="/static/app.css" />
<script>try{var t=localStorage.getItem("vc-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="auth">
  <div class="form-side">
    <form id="form" novalidate>
      <a class="brand" href="/" style="padding:0" id="brandLink"></a>
      <h1>Start clipping free</h1>
      <p class="muted" style="margin-bottom:24px">30 free minutes every month. No card needed.</p>
      <div class="field"><label for="name">Name</label><input class="input" id="name" autocomplete="name" maxlength="80" /></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" required /></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required /></div>
      <label class="check" style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--muted)"><input type="checkbox" id="agree" style="margin-top:3px" /><span>I am {{MIN_AGE}} or older and I accept the <a href="/terms" style="text-decoration:underline">Terms</a> and <a href="/privacy" style="text-decoration:underline">Privacy Policy</a>.</span></label>
      <div id="capBox" style="margin-top:14px"></div>
      <button class="btn lg" id="submit">Create account</button>
      <p class="form-err" id="err" role="alert"></p>
            <p class="alt">Already have an account? <a href="/login" id="altLink">Log in</a></p>
    </form>
  </div>
  <div class="art" aria-hidden="true">
    <div class="stack-art">
      <div class="mini"><div class="bg"></div><span class="badge-score mid">▲ 78</span><div class="cap">WAIT FOR <em>IT</em></div></div>
      <div class="mini"><div class="bg"></div><span class="badge-score hi">▲ 94</span><div class="cap">NOBODY <em>TELLS</em> YOU</div></div>
      <div class="mini"><div class="bg"></div><span class="badge-score hi">▲ 88</span><div class="cap">THIS <em>CHANGED</em> IT</div></div>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
<script>
  const { $, api, safeNext, ICON } = VC;
  $("#brandLink").innerHTML = `${ICON.logo}<span>Verticlip</span>`;
  const next = safeNext(new URLSearchParams(location.search).get("next"));
  if (next !== "/dashboard") $("#altLink").href += "?next=" + encodeURIComponent(next);
  let cap = { token: () => "", reset() { } };
  VC.captcha($("#capBox")).then((c) => { cap = c; });
  $("#form").onsubmit = async (e) => {
    e.preventDefault();
    $("#err").textContent = "";
    if (!$("#agree").checked) { $("#err").textContent = "Please confirm your age and accept the Terms and Privacy Policy."; return; }
    const btn = $("#submit"); btn.disabled = true;
    try {
      await api("/api/auth/signup", { method: "POST", body: { name: $("#name").value, email: $("#email").value, password: $("#password").value, agree: true, captcha: cap.token() } });
      location.href = next;
    } catch (err) { $("#err").textContent = err.message; btn.disabled = false; cap.reset(); }
  };
</script>
</body>
</html>
